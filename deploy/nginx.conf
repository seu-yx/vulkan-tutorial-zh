server {
    listen 127.0.0.1:18765;
    server_name vulkan.sktyx.top localhost;
    root /opt/vulkan-tutorial/public;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    location ~ /\. { deny all; }
    location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
    location /data/ { expires -1; try_files $uri =404; }
    location /assets/ { expires 1d; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ =404; }
}
