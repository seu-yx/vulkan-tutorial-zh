name: Sync Vulkan tutorial and publish Pages

on:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/**
      - tests/**
      - translations/**
      - glossary.json
      - terminology.json
      - terminology.schema.json
      - package.json
      - package-lock.json
      - requirements.txt
      - .github/workflows/pages.yml
  schedule:
    # UTC 20:23 = 04:23 the following day in Asia/Shanghai.
    - cron: '23 20 * * *'
  repository_dispatch:
    types: [vulkan-polish-backfill]
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even when upstream is unchanged
        type: boolean
        default: false
      translate_limit:
        description: Maximum new Google translations for this run
        type: number
        default: 500
      polish_limit:
        description: Maximum whole chapters to check sequentially (1-10; uses AI credits)
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: vulkan-pages-and-sync
  queue: max

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'repository_dispatch' && 50 || 25 }}
    permissions:
      contents: write
      pages: read
      copilot-requests: write
    outputs:
      publish: ${{ steps.gate.outputs.run }}
      continue_backfill: ${{ steps.continuation.outputs.continue }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Check the upstream Git commit
        id: gate
        env:
          FORCE_BUILD: ${{ inputs.force_build || false }}
          POLISH_ENABLED: ${{ vars.POLISH_ENABLED != 'false' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            python scripts/ci_gate.py --backfill
          elif [ "$FORCE_BUILD" = "true" ]; then
            python scripts/ci_gate.py --force
          else
            python scripts/ci_gate.py
          fi
      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore the upstream Git checkout and render cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .local/upstream
            .local/rendered.json
          key: vulkan-upstream-${{ runner.os }}-${{ steps.gate.outputs.upstream_sha }}
          restore-keys: vulkan-upstream-${{ runner.os }}-
      - name: Install build dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:syntax
          python -m pip install -r requirements.txt
      - name: Install the pinned Copilot CLI
        if: steps.gate.outputs.run == 'true' && vars.POLISH_ENABLED != 'false'
        continue-on-error: true
        run: npm install --global @github/copilot@1.0.114 --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Test the mirror pipeline
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Sync Git changes and translate a bounded batch
        if: steps.gate.outputs.run == 'true' && github.event_name != 'repository_dispatch'
        env:
          TRANSLATE_LIMIT: ${{ inputs.translate_limit || 500 }}
          PYTHONUNBUFFERED: '1'
        run: |
          if ! [[ "$TRANSLATE_LIMIT" =~ ^[0-9]+$ ]] || [ "$TRANSLATE_LIMIT" -lt 1 ] || [ "$TRANSLATE_LIMIT" -gt 500 ]; then
            echo '::error::translate_limit must be an integer from 1 to 500'
            exit 1
          fi
          python scripts/sync.py --provider google --workers 1 --delay 2 \
            --translate-limit "$TRANSLATE_LIMIT" --translation-seconds 600 \
            --import-cache translations/google.jsonl --export-cache translations/google.jsonl
      - name: Rebuild the current translation snapshot for backlog review
        if: steps.gate.outputs.run == 'true' && github.event_name == 'repository_dispatch'
        env:
          PINNED_SHA: ${{ steps.gate.outputs.upstream_sha }}
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p .local
          cp translations/polish-state.json .local/polish-before.json
          python scripts/sync.py --upstream-revision "$PINNED_SHA" --skip-translate \
            --import-cache translations/google.jsonl
      - name: Check changed chapters and resume a sequential polish backfill
        id: polish
        if: steps.gate.outputs.run == 'true' && vars.POLISH_ENABLED != 'false'
        timeout-minutes: ${{ github.event_name == 'repository_dispatch' && 43 || 9 }}
        continue-on-error: true
        env:
          # Only this inference step receives the short-lived Copilot token.
          GITHUB_TOKEN: ${{ github.token }}
          POLISH_LIMIT: ${{ inputs.polish_limit }}
          INITIAL_BACKFILL: ${{ github.event.client_payload.initial == true }}
          COPILOT_AUTO_UPDATE: 'false'
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$INITIAL_BACKFILL" = "true" ]; then
              POLISH_LIMIT=8
              POLISH_SECONDS=480
            else
              POLISH_LIMIT=50
              POLISH_SECONDS=2400
            fi
          else
            POLISH_LIMIT="${POLISH_LIMIT:-5}"
            if ! [[ "$POLISH_LIMIT" =~ ^([1-9]|10)$ ]]; then
              echo '::error::polish_limit must be an integer from 1 to 10 chapters'
              exit 1
            fi
            POLISH_SECONDS=420
          fi
          python scripts/polish.py --auto --backfill --limit "$POLISH_LIMIT" --seconds "$POLISH_SECONDS" \
            --state translations/polish-state.json --report .local/polish-auto.json --model auto
      - name: Apply the valid polish cache without a model call
        if: steps.gate.outputs.run == 'true' && steps.polish.outcome != 'success'
        continue-on-error: true
        run: python scripts/polish.py --apply
      - name: Validate the generated website
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" != "repository_dispatch" ]; then
            python scripts/ci_gate.py --record
          fi
          python tests/check_site.py
          python scripts/audit_terminology.py
          python scripts/audit_translation_quality.py
          touch public/.nojekyll
      - name: Save the audit and polish checkpoint
        if: always() && steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: polish-progress-${{ github.run_id }}
          path: |
            .local/polish-auto.json
            .local/translation-quality.json
            translations/polish.json
            translations/polish-state.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve translation progress in Git
        if: steps.gate.outputs.run == 'true'
        run: |
          git status --short
          if [ "$GITHUB_EVENT_NAME" != "repository_dispatch" ]; then
            git add -- translations/google.jsonl translations/upstream.json
          fi
          for cache in translations/polish.json translations/polish-state.json; do
            if [ -f "$cache" ]; then
              git add -- "$cache"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: update translations and upstream revision [skip ci]'
            if ! git push origin HEAD:main; then
              echo '::error::Could not fast-forward main. Check the remote branch and retry from the latest revision. The polish checkpoint is available as an artifact.'
              exit 1
            fi
          fi
      - name: Check whether the backlog should continue
        id: continuation
        if: github.event_name == 'repository_dispatch' && steps.polish.outcome == 'success'
        run: python scripts/ci_gate.py --continue-backfill .local/polish-before.json
      - name: Configure Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - name: Upload the static website
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  resume_backfill:
    needs: [build, deploy]
    if: needs.build.outputs.continue_backfill == 'true' && needs.deploy.result == 'success' && vars.POLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Queue the next backlog batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error --fail --max-time 30 --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --data '{"event_type":"vulkan-polish-backfill"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dispatches"
