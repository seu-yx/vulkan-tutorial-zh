name: Start or resume the translation backlog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/polish-backfill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start_backfill:
    if: github.ref == 'refs/heads/main' && vars.POLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Queue the first backlog batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error --fail --max-time 30 --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --data '{"event_type":"vulkan-polish-backfill","client_payload":{"initial":true}}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dispatches"
